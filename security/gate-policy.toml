# PipelineFortress gate policy (policy as code).
# Only findings that are NEW relative to security/baselines/baseline.json are
# evaluated. A new finding blocks the merge when its severity is at or above
# fail_on for its stage.

[secrets]
# Zero tolerance: any new hard-coded credential blocks, whatever its severity.
fail_on = "LOW"

[sast]
fail_on = "HIGH"

[sca]
# Block only when upgrading is actually possible; unfixable CVEs are tracked
# in the dashboard instead of failing builds nobody can make green.
fail_on = "CRITICAL"
require_fix = true

[iac]
# Our own manifests are clean, and IaC fixes are cheap: any new misconfiguration
# blocks. Accepted exceptions are inline `checkov:skip` annotations that carry
# a written reason, so they are reviewed like code.
fail_on = "LOW"

[container]
# Same reasoning as SCA, applied to everything inside the built image
# (OS packages of the base image plus production node_modules).
fail_on = "CRITICAL"
require_fix = true

[dast]
# ZAP baseline is passive; HIGH-risk alerts on a new build are regressions.
fail_on = "HIGH"
