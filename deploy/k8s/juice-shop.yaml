apiVersion: v1
kind: Namespace
metadata:
  name: juice-shop
  labels:
    # Enforced by the API server's Pod Security Admission: pods that are not
    # non-root, seccomp-confined and capability-free are rejected at deploy.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: juice-shop
  labels:
    app: juice-shop
  annotations:
    checkov.io/skip1: CKV_K8S_15=Image is built in the same CI job and side-loaded with kind load; there is no registry to pull from, so Always would fail the pull
    checkov.io/skip2: CKV_K8S_43=Locally built image has no registry digest; integrity comes from building, scanning and loading it in one job
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juice-shop
  template:
    metadata:
      labels:
        app: juice-shop
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      # The root filesystem is read-only. Juice Shop rewrites a few of its own
      # directories at startup and runtime, so copy those into a writable
      # volume first and mount only them back over the read-only image.
      initContainers:
        - name: seed-writable-dirs
          image: juice-shop:ci
          imagePullPolicy: IfNotPresent
          command:
            - /nodejs/bin/node
            - -e
            - >-
              const fs = require('node:fs');
              for (const d of ['frontend/dist', 'ftp', 'i18n', 'data', 'uploads'])
              fs.cpSync('/juice-shop/' + d, '/state/' + d, { recursive: true });
          securityContext: &containerSecurity
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: state
              mountPath: /state
      containers:
        - name: juice-shop
          image: juice-shop:ci
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          securityContext: *containerSecurity
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - { name: state, mountPath: /juice-shop/frontend/dist, subPath: frontend/dist }
            - { name: state, mountPath: /juice-shop/ftp, subPath: ftp }
            - { name: state, mountPath: /juice-shop/i18n, subPath: i18n }
            - { name: state, mountPath: /juice-shop/data, subPath: data }
            - { name: state, mountPath: /juice-shop/uploads, subPath: uploads }
            - { name: logs, mountPath: /juice-shop/logs }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet:
              path: /rest/admin/application-version
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /rest/admin/application-version
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: state
          emptyDir:
            sizeLimit: 256Mi
        - name: logs
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: juice-shop
  namespace: juice-shop
spec:
  type: ClusterIP
  selector:
    app: juice-shop
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# Default deny for everything in the namespace...
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: juice-shop
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# ...then allow only HTTP in to Juice Shop and DNS out. The app has no
# legitimate reason to open outbound connections.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: juice-shop-http
  namespace: juice-shop
spec:
  podSelector:
    matchLabels:
      app: juice-shop
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 3000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
